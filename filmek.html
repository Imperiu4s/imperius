<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>Imperius</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
</head>

<body>
    <header>
        <div class="logo"><i class="fa-solid fa-crown"></i> Imperius.hu</div>
        <nav>
            <a href="index.html">Főoldal</a>
            <a href="partner.html">Partnerek</a>
            <a href="projektek.html">Projektek</a>
            <a href="youtube.html">YouTube</a>
            <a href="filmek.html">Filmek</a>
        </nav>
    </header>


    <main>
        <section class="movies-section">
            <h2 class="title-fix">
                <i class="fa-solid fa-clapperboard"></i>
                <span>Filmek</span>
            </h2>

            <div class="movies-grid">

                <div class="movie-card" data-movie="stranger">
                    <div class="movie-poster">
                        <img src="assets/stranger_things.png" alt="Stranger Things">
                    </div>
                    <div class="movie-info">
                        <h3>Stranger Things</h3>
                        <div class="rating">★★★★☆ <span>(3.0)</span></div>
                    </div>
                </div>

                <div class="movie-card" data-movie="kpop">
                    <div class="movie-poster">
                        <img src="assets/kpop.png" alt="K-pop Demon Hunters">
                    </div>
                    <div class="movie-info">
                        <h3>K-pop Demon Hunters</h3>
                        <div class="rating">★★★★★ <span>(4.5)</span></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div id="playerModal" class="player-modal">
        <div class="player-content">
            <span class="close-btn" onclick="closePlayer()">✖</span>

            <h3 id="playerTitle"></h3>

            <div id="episodeControls"></div>

            <iframe id="videoFrame" src="" allowfullscreen></iframe>
        </div>
    </div>


    <footer>
        <a href="hu/hasznalati-feltetelek.html">Használati feltételek</a>
        <a href="hu/adatvedelmi-iranyelvek.html">Adatvédelmi irányelvek</a>
        <a href="hu/ceg-informaciok.html">Cég információk</a>
        <p>Domain szolgáltató: Rackhost.hu</p>
    </footer>
</body>

</html>
