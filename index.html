<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperiu4s Community – Karbantartás alatt</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* MINDEN kurzor eltüntetése */
        *, body, a, button, input, textarea {
            cursor: none !important;
        }

        /* Egyedi pont kurzor */
        #cursor {
            position: fixed;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d0ff;
            box-shadow: 0 0 12px #00d0ff;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease;
        }

        /* Hover effektek */
        a:hover ~ #cursor,
        button:hover ~ #cursor {
            width: 24px;
            height: 24px;
        }

        /* Gradient text (kékes) */
        .gradient-text {
            background: linear-gradient(90deg, #00d0ff, #4bb8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Fade-in */
        .fade {
            opacity: 0;
            transform: translateY(20px);
            transition: 0.8s ease;
            will-change: opacity, transform;
        }
        .fade.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ÚJ SÖTÉT ŰR-HÁTTÉR (NINCS BENNE LILA) */
        .space-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at center, #050508 0%, #020207 40%, #000000 100%);
        }

        /* Sötétkék köd (nebula helyett) */
        .dark-nebula {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 30%, rgba(0, 60, 120, 0.25), transparent 60%),
                radial-gradient(circle at 70% 60%, rgba(0, 40, 80, 0.25), transparent 60%),
                radial-gradient(circle at 40% 80%, rgba(0, 30, 60, 0.25), transparent 60%);
            filter: blur(80px);
            animation: nebulaMove 60s ease-in-out infinite;
            opacity: 0.35;
        }

        @keyframes nebulaMove {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(10%, 5%) scale(1.1); }
            100% { transform: translate(-10%, -10%) scale(1); }
        }

        /* Parázs részecskék */
        .ember {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255, 120, 0, 0.9);
            box-shadow: 0 0 12px rgba(255, 120, 0, 0.9);
            will-change: transform, opacity;
        }

        /* Title animation */
        .title-animate {
            opacity: 0;
            transform: translateY(-10px) scale(0.98);
            animation: titleIn 1.2s ease forwards, titlePulse 3s ease-in-out infinite 1.2s;
        }

        @keyframes titleIn {
            0% { opacity: 0; transform: translateY(-10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes titlePulse {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(0) scale(1.03); }
            100% { transform: translateY(0) scale(1); }
        }

        /* Discord button glow */
        .discord-btn {
            background: linear-gradient(90deg, #5865F2, #4b55d6);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transition: 0.3s ease;
        }
        .discord-btn:hover {
            box-shadow: 0 0 35px rgba(88, 101, 242, 0.9);
            transform: scale(1.05);
        }
    </style>
</head>

<body class="bg-[#050509] text-white font-sans overflow-x-hidden">

<!-- Egyedi kurzor -->
<div id="cursor"></div>

<!-- ÚJ SÖTÉT ŰR-HÁTTÉR -->
<div class="space-bg">
    <div class="dark-nebula"></div>
    <div id="embers"></div>
</div>

<!-- MAIN CONTENT -->
<section class="min-h-screen flex flex-col justify-center items-center text-center px-6 fade">

    <h1 class="text-4xl md:text-5xl font-extrabold gradient-text title-animate">
        Az oldal jelenleg karbantartás alatt áll
    </h1>

    <p class="mt-6 text-gray-300 max-w-xl">
        Az Imperiu4s Community weboldalát éppen frissítjük és fejlesztjük.
        Hamarosan visszatérünk egy még modernebb, gyorsabb és biztonságosabb felülettel.
    </p>

    <!-- Discord Button -->
    <a href="https://discord.gg/imperiu4s" target="_blank"
       class="discord-btn mt-10 px-6 py-3 rounded-xl text-lg font-semibold flex items-center gap-3">
        <i class="fa-brands fa-discord text-2xl"></i>
        Csatlakozz a Discord szerverünkhöz
    </a>

    <!-- Status -->
    <div class="mt-12 bg-white/10 backdrop-blur-xl px-6 py-4 rounded-xl border border-white/10">
        <p class="text-gray-300">Karbantartás állapota: <span class="font-bold text-white">Folyamatban</span></p>
    </div>

</section>

<!-- JS -->
<script>
    /* Fade-in */
    window.addEventListener("load", () => {
        document.querySelectorAll(".fade").forEach((el, i) => {
            setTimeout(() => el.classList.add("show"), 150 * i);
        });
    });

    /* Custom cursor */
    const cursor = document.getElementById("cursor");
    document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    });

    /* Parázs részecskék */
    const emberContainer = document.getElementById("embers");
    const emberCount = 25;

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    for (let i = 0; i < emberCount; i++) {
        const e = document.createElement("div");
        e.classList.add("ember");

        const startX = random(0, window.innerWidth);
        const startY = random(0, window.innerHeight);
        const duration = random(6, 14);

        e.style.left = `${startX}px`;
        e.style.top = `${startY}px`;

        e.animate(
            [
                { transform: "translateY(0)", opacity: 0.4 },
                { transform: "translateY(-40px)", opacity: 0.9 },
                { transform: "translateY(0)", opacity: 0.3 }
            ],
            {
                duration: duration * 1000,
                iterations: Infinity,
                easing: "ease-in-out"
            }
        );

        emberContainer.appendChild(e);
    }
</script>

</body>
</html>
