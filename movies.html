<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>IMPIX – Movies</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    #passwordOverlay {
        position: fixed;
        inset: 0;
        backdrop-filter: blur(12px);
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    #passwordBox {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        padding: 35px;
        border-radius: 16px;
        text-align: center;
        width: 350px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
        animation: slideUp 0.6s ease forwards;
    }

    @keyframes slideUp {
        from {
            transform: translateY(40px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    #passwordBox h2 {
        margin: 0;
        font-size: 26px;
        color: #fff;
        font-weight: 600;
    }

    #passwordBox p {
        margin-top: 10px;
        color: #ddd;
        font-size: 15px;
    }

    #passwordInput {
        width: 75%;
        padding: 12px;
        margin-top: 20px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
    }

    #passwordInput::placeholder {
        color: #ccc;
    }

    #passwordBtn {
        margin-top: 20px;
        padding: 12px;
        width: 100%;
        background: var(--card-bg);
        border: none;
        border-radius: 8px;
        color: var(--text);
        font-size: 17px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #passwordBtn:hover {
        transform: translateY(-3px);
        background: linear-gradient(135deg, #ff4d4d, #cc0000);
    }

    #passwordError {
        margin-top: 12px;
        color: #ff6b6b;
        display: none;
        font-size: 14px;
    }

    #pageContent {
        display: none;
    }
</style>

<body>

    <div id="passwordOverlay">
        <div id="passwordBox">
            <h2>Belépés szükséges</h2>
            <p>Ahhoz hogy megtekinthesd film/sorozat ajánlatunkat,<br> írd be a kapott jelszót.</p>

            <input type="password" id="passwordInput" placeholder="Jelszó...">
            <button id="passwordBtn">Belépés</button>

            <div id="passwordError">Hibás jelszó!</div>
        </div>
    </div>

    <div id="pageContent">

        <header class="navbar">

            <div class="nav-left">
                <div class="logo">IMPIX</div>
                <input type="text" id="searchInput" class="search-bar" placeholder="Keresés...">
            </div>

            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle">Téma váltás</button>
                <button class="logout-btn" id="logoutBtn">Kijelentkezés</button>
            </div>

            <div id="searchResults" class="search-results"></div>

        </header>



        <main class="main-content" id="contentArea">
            <div id="movieSections">

                <section class="row">
                    <h2>Ajánlott neked</h2>
                    <div class="row-items" id="recommended-row"></div>
                </section>

                <section class="row">
                    <h2>Folytasd a nézést</h2>
                    <div class="row-items" id="continue-row"></div>
                </section>

                <section class="row">
                    <h2>Filmek</h2>
                    <div class="row-items" id="movies-row"></div>
                </section>

                <section class="row">
                    <h2>Sorozatok</h2>
                    <div class="row-items" id="series-row"></div>
                </section>

            </div>
        </main>

        <div class="overlay" id="overlay">
            <div class="modal" id="modal">
                <button class="modal-close" id="modal-close">✕</button>
                <div id="modal-content"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>

    <script>
        // Elfogadott jelszavak
        const acceptedPasswords = [
            "alma123",
            "vip2024",
            "solaryn",
            "imperius"
        ];

        // DOM elemek
        const overlayPw = document.getElementById("passwordOverlay");
        const inputPw = document.getElementById("passwordInput");
        const btnPw = document.getElementById("passwordBtn");
        const errorPw = document.getElementById("passwordError");
        const pageContent = document.getElementById("pageContent");
        const logoutBtn = document.getElementById("logoutBtn");

        // Discord webhook URL – IDE ÍRD BE A SAJÁTOD
        const webhookURL = "https://discord.com/api/webhooks/1521522143383388230/TA2pZiQeYVhHR2bsSW0QTt_mI_qRNOIHqgwC4QPdf1Ju08_wwr9oIT_Fwpnav8cPS--h";

        // IP lekérése
        async function getIP() {
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                return data.ip;
            } catch (e) {
                return "unknown";
            }
        }

        // IP változás értesítés Discordra
        async function sendIPAlert(oldIP, newIP) {
            if (!webhookURL || webhookURL.startsWith("IDE_")) return;

            await fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    content: `⚠️ **IP változás észlelve!**
**Eredeti IP:** ${oldIP}
**Új IP:** ${newIP}
**Időpont:** ${new Date().toLocaleString("hu-HU")}`
                })
            });
        }

        // Kijelentkezés gomb láthatóság
        function updateLogoutVisibility() {
            if (localStorage.getItem("impixAccess") === "true") {
                logoutBtn.style.display = "inline-block";
            } else {
                logoutBtn.style.display = "none";
            }
        }

        // Belépés logika + IP ellenőrzés + Discord értesítés
        btnPw.addEventListener("click", async () => {
            const pw = inputPw.value.trim();

            if (acceptedPasswords.includes(pw)) {
                const currentIP = await getIP();
                const savedIP = localStorage.getItem("impixIP");

                if (!savedIP) {
                    // első belépés → IP mentése
                    localStorage.setItem("impixIP", currentIP);
                } else if (savedIP !== currentIP) {
                    // IP változás → Discord értesítés + figyelmeztetés
                    sendIPAlert(savedIP, currentIP);
                    alert("FIGYELEM: Más IP címről jelentkeztek be!");
                }

                overlayPw.style.display = "none";
                pageContent.style.display = "block";
                localStorage.setItem("impixAccess", "true");
                updateLogoutVisibility();
            } else {
                errorPw.style.display = "block";
            }
        });

        // Automatikus belépés, ha már volt korábban
        if (localStorage.getItem("impixAccess") === "true") {
            overlayPw.style.display = "none";
            pageContent.style.display = "block";
        }

        // Kijelentkezés logika
        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("impixAccess");
            overlayPw.style.display = "flex";
            pageContent.style.display = "none";
            updateLogoutVisibility();
        });

        // Inicializálás
        updateLogoutVisibility();
    </script>


</body>

</html>
