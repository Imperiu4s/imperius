<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>IMPIX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">IMPIX</div>
        <button class="theme-toggle" id="themeToggle">Téma váltás</button>
        <input type="text" id="searchInput" class="search-bar" placeholder="Keresés...">
        <div id="searchResults" class="search-results"></div>
    </header>

    <main class="main-content" id="contentArea">
        <div id="movieSections">

            <section class="row">
                <h2>Ajánlott neked</h2>
                <div class="row-items" id="recommended-row"></div>
            </section>

            <section class="row">
                <h2>Folytasd a nézést</h2>
                <div class="row-items" id="continue-row"></div>
            </section>

            <section class="row">
                <h2>Filmek</h2>
                <div class="row-items" id="movies-row"></div>
            </section>

            <section class="row">
                <h2>Sorozatok</h2>
                <div class="row-items" id="series-row"></div>
            </section>

        </div>
    </main>

    <script src="app.js"></script>

    <!-- VIP ellenőrzés -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            window.location.href = "/nomovies";
        } else {
            fetch(`/check-vip?token=${encodeURIComponent(token)}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.vip) {
                        window.location.href = "/nomovies";
                    }
                })
                .catch(() => {
                    window.location.href = "/nomovies";
                });
        }
    </script>

</body>

</html>
