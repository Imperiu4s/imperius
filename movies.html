<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <title>IMPIX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">IMPIX</div>

        <button class="theme-toggle" id="themeToggle">Téma váltás</button>

        <input type="text" id="searchInput" class="search-bar" placeholder="Keresés...">
        <div id="searchResults" class="search-results"></div>
    </header>

    <main class="main-content" id="contentArea">

        <div id="movieSections">

            <section class="row">
                <h2>Ajánlott neked</h2>
                <div class="row-items" id="recommended-row"></div>
            </section>

            <section class="row">
                <h2>Folytasd a nézést</h2>
                <div class="row-items" id="continue-row"></div>
            </section>

            <section class="row">
                <h2>Filmek</h2>
                <div class="row-items" id="movies-row"></div>
            </section>

            <section class="row">
                <h2>Sorozatok</h2>
                <div class="row-items" id="series-row"></div>
            </section>

        </div>

    </main>

    <!-- Modal -->
    <div class="overlay" id="overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>

</body>

</html>
