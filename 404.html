<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script>
(function(){
  try {
    var urlTheme = new URLSearchParams(location.search).get('theme');
    var saved = localStorage.getItem('imperius-theme');
    var theme = (urlTheme === 'light' || urlTheme === 'dark') ? urlTheme
      : (saved || 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    if (urlTheme === 'light' || urlTheme === 'dark') localStorage.setItem('imperius-theme', theme);

    // Set data-lang here too (not just in i18n.js), and synchronously —
    // i18n.js only applies it on DOMContentLoaded, which fires AFTER
    // main.js's deferred code already ran, so anything main.js reads
    // the language for on first paint (the preloader's status text,
    // the very first video/stats render) was always defaulting to
    // Hungarian regardless of the visitor's actual chosen language.
    var urlLang = new URLSearchParams(location.search).get('lang');
    var savedLang = localStorage.getItem('imperius-lang');
    var lang = (urlLang === 'hu' || urlLang === 'en') ? urlLang
      : ((savedLang === 'hu' || savedLang === 'en') ? savedLang : 'hu');
    document.documentElement.setAttribute('data-lang', lang);
  } catch (e) {}
})();
</script>
</head>
