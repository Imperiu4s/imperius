<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>404 – Az oldal nem található</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    :root {
      --primary-bg: #ffffff;
      --primary-text: #111827;
      --secondary-blue: #1e6bd6;
      --secondary-blue-light: #4da3ff;
      --muted-bg: #f3f4f6;
      --card-border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--primary-bg);
      color: var(--primary-text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      border-bottom: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      color: var(--secondary-blue);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
    }

    .nav-links a {
      position: relative;
      padding-bottom: 0.15rem;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary-blue), var(--secondary-blue-light));
      transition: width 0.2s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--secondary-blue);
      color: var(--secondary-blue);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-cta:hover {
      background: var(--secondary-blue);
      color: #ffffff;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3.5rem;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.6fr);
      gap: 2.5rem;
      align-items: center;
      margin-bottom: 3rem;
    }

    .hero-text h1 {
      font-size: clamp(2rem, 3vw, 2.6rem);
      margin-bottom: 0.75rem;
    }

    .hero-text h1 span {
      background: linear-gradient(90deg, var(--secondary-blue), var(--secondary-blue-light));
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-text p {
      color: #4b5563;
      max-width: 32rem;
      margin-bottom: 1.5rem;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .tag {
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: var(--muted-bg);
      color: #374151;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--secondary-blue), var(--secondary-blue-light));
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: transparent;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #374151;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    .hero-card {
      background: #f9fafb;
      border-radius: 1.25rem;
      padding: 1.5rem;
      border: 1px solid #e5e7eb;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    .hero-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero-card-main {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .hero-card-main span {
      color: var(--secondary-blue);
    }

    .hero-card-list {
      list-style: none;
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .hero-card-list li {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hero-card-list li::before {
      content: "•";
      color: var(--secondary-blue);
      font-weight: 700;
    }

    .hero-card-footer {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 0.75rem;
    }

    .sections-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #111827;
    }

    .sections-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
    }

    .section-card {
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.25rem 1.3rem 1.4rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .section-icon {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.9rem;
      background: linear-gradient(135deg, var(--secondary-blue), var(--secondary-blue-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .section-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .section-text {
      font-size: 0.9rem;
      color: #4b5563;
    }

    .section-meta {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-links a {
      color: #4b5563;
    }

    .footer-links a:hover {
      color: var(--secondary-blue);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 800px) {
      .sections-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 640px) {
      .nav {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .nav-links {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 0.85rem;
      }
      .nav-cta {
        font-size: 0.8rem;
      }
      main {
        padding-inline: 1rem;
      }
      .footer-inner {
        padding-inline: 1rem;
      }
    }
  </style>
</head>
<body>

<main style="text-align:center;padding:4rem 1rem;">
  <h1 style="font-size:3rem;color:#1e6bd6;">404</h1>
  <p style="font-size:1.2rem;margin-bottom:1rem;">Sajnos ez az oldal nem létezik.</p>
  <a href="index.html" class="nav-cta" style="font-size:1rem;">Vissza a főoldalra</a>
</main>

</body>
</html>
